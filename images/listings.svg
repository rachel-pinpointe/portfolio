<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 310" width="1290" height="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1290" height="310" fill="#fff"/><text x="40" y="44" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">NYC listings platform</text><text x="40" y="68" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">One database for off-market listings that arrive in any format.</text><rect x="40" y="104" width="214" height="128" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="62" cy="128" r="11" fill="#0F766E"/><text x="62" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="82" y="133" font-size="16" font-weight="700" fill="#1F2937">Sources</text><text x="58" y="160" font-size="13" fill="#6B7280">Emails, PDFs, docs,</text><text x="58" y="179" font-size="13" fill="#6B7280">and spreadsheets from</text><text x="58" y="198" font-size="13" fill="#6B7280">landlords and brokers</text><line x1="258" y1="168" x2="284" y2="168" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="288" y="104" width="214" height="128" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="310" cy="128" r="11" fill="#0F766E"/><text x="310" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="330" y="133" font-size="16" font-weight="700" fill="#1F2937">Parsers</text><text x="306" y="160" font-size="13" fill="#6B7280">A dedicated parser for</text><text x="306" y="179" font-size="13" fill="#6B7280">each landlord source.</text><text x="306" y="198" font-size="13" fill="#6B7280">Replaced a single AI prompt</text><line x1="506" y1="168" x2="532" y2="168" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="536" y="104" width="214" height="128" rx="10" fill="#E4F3F0" stroke="#0F766E" stroke-width="1.5"/><circle cx="558" cy="128" r="11" fill="#0F766E"/><text x="558" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="578" y="133" font-size="16" font-weight="700" fill="#1F2937">Database</text><text x="554" y="160" font-size="13" fill="#6B7280">One searchable record</text><text x="554" y="179" font-size="13" fill="#6B7280">per listing. Supabase</text><line x1="754" y1="168" x2="780" y2="168" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="784" y="104" width="214" height="128" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="806" cy="128" r="11" fill="#0F766E"/><text x="806" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="826" y="133" font-size="16" font-weight="700" fill="#1F2937">Search</text><text x="802" y="160" font-size="13" fill="#6B7280">Filters and map search.</text><text x="802" y="179" font-size="13" fill="#6B7280">Mapbox</text><line x1="1002" y1="168" x2="1028" y2="168" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="1032" y="104" width="214" height="128" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="1054" cy="128" r="11" fill="#0F766E"/><text x="1054" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="1074" y="133" font-size="16" font-weight="700" fill="#1F2937">Agent view</text><text x="1050" y="160" font-size="13" fill="#6B7280">Role-based access for</text><text x="1050" y="179" font-size="13" fill="#6B7280">agents and managers.</text><text x="1050" y="198" font-size="13" fill="#6B7280">Next.js on Vercel</text><text x="40" y="282" font-size="14" fill="#1F2937" font-weight="400" text-anchor="start">In use: 1,000+ listings, 6 agents, 3 to 5 hours saved per client search. Phase 1 shipped in one month.</text></svg>