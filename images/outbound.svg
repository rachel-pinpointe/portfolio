<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1160" height="520" fill="#fff"/><text x="40" y="44" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">Outbound GTM system</text><text x="40" y="68" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">From signal to sequence. Fibery is read and written at every step.</text><rect x="40" y="100" width="250" height="118" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="62" cy="124" r="11" fill="#0F766E"/><text x="62" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="82" y="129" font-size="16" font-weight="700" fill="#1F2937">Sources</text><text x="58" y="156" font-size="13" fill="#6B7280">Paradigm and funding newsletters</text><text x="58" y="175" font-size="13" fill="#6B7280">via Zapier, plus the daily</text><text x="58" y="194" font-size="13" fill="#6B7280">hypersignal-gtm signal scan</text><line x1="294" y1="159" x2="316" y2="159" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="320" y="100" width="250" height="118" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="342" cy="124" r="11" fill="#0F766E"/><text x="342" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="362" y="129" font-size="16" font-weight="700" fill="#1F2937">Qualify</text><text x="338" y="156" font-size="13" fill="#6B7280">ICP check: open NYC roles,</text><text x="338" y="175" font-size="13" fill="#6B7280">not remote, $150K+ pay where</text><text x="338" y="194" font-size="13" fill="#6B7280">listed. About 1,500 companies</text><line x1="574" y1="159" x2="596" y2="159" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="600" y="100" width="250" height="118" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="622" cy="124" r="11" fill="#0F766E"/><text x="622" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="642" y="129" font-size="16" font-weight="700" fill="#1F2937">Find contacts</text><text x="618" y="156" font-size="13" fill="#6B7280">Waterfall (QuickEnrich, String,</text><text x="618" y="175" font-size="13" fill="#6B7280">Hunter) for People Ops, Finance,</text><text x="618" y="194" font-size="13" fill="#6B7280">and Recruiting. Stops at an email</text><line x1="854" y1="159" x2="876" y2="159" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="880" y="100" width="250" height="118" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="902" cy="124" r="11" fill="#0F766E"/><text x="902" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="922" y="129" font-size="16" font-weight="700" fill="#1F2937">Research and write</text><text x="898" y="156" font-size="13" fill="#6B7280">Claude researches stated goals</text><text x="898" y="175" font-size="13" fill="#6B7280">and writes a three-email</text><text x="898" y="194" font-size="13" fill="#6B7280">sequence per contact</text><rect x="40" y="268" width="250" height="118" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="62" cy="292" r="11" fill="#0F766E"/><text x="62" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="82" y="297" font-size="16" font-weight="700" fill="#1F2937">Guardrails then enroll</text><text x="58" y="324" font-size="13" fill="#6B7280">60-day contact gate, Apollo activity</text><text x="58" y="343" font-size="13" fill="#6B7280">check, 25 companies a day cap.</text><text x="58" y="362" font-size="13" fill="#6B7280">Enrolls in an Apollo sequence</text><line x1="294" y1="327" x2="316" y2="327" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="320" y="268" width="250" height="118" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="342" cy="292" r="11" fill="#0F766E"/><text x="342" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text><text x="362" y="297" font-size="16" font-weight="700" fill="#1F2937">Positive reply</text><text x="338" y="324" font-size="13" fill="#6B7280">A prospect answers the sequence.</text><text x="338" y="343" font-size="13" fill="#6B7280">The lead is reviewed in Fibery</text><text x="338" y="362" font-size="13" fill="#6B7280">before it is promoted</text><line x1="574" y1="327" x2="596" y2="327" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="600" y="268" width="250" height="118" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><circle cx="622" cy="292" r="11" fill="#0F766E"/><text x="622" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text><text x="642" y="297" font-size="16" font-weight="700" fill="#1F2937">Promote</text><text x="618" y="324" font-size="13" fill="#6B7280">One click on Promote. An hourly</text><text x="618" y="343" font-size="13" fill="#6B7280">sync moves the lead into CRM</text><text x="618" y="362" font-size="13" fill="#6B7280">Accounts and Contacts</text><path d="M1005.0,222 V234 H165.0 V264" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="40" y="432" width="1090" height="64" rx="10" fill="#E4F3F0" stroke="#0F766E" stroke-width="1.5"/><text x="60" y="459" font-size="16" fill="#1F2937" font-weight="700" text-anchor="start">Fibery GTM Pipeline</text><text x="60" y="481" font-size="13" fill="#6B7280" font-weight="400" text-anchor="start">System of record. Signals, companies, contacts, and sequence status all live here.</text><rect x="880" y="268" width="250" height="118" rx="10" fill="#E4F3F0" stroke="#0F766E" stroke-width="1.5"/><circle cx="902" cy="292" r="11" fill="#0F766E"/><text x="902" y="297" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">8</text><text x="922" y="297" font-size="16" font-weight="700" fill="#1F2937">CRM</text><text x="898" y="324" font-size="13" fill="#6B7280">Accounts and Contacts</text><text x="898" y="343" font-size="13" fill="#6B7280">in the Fibery CRM space.</text><text x="898" y="362" font-size="13" fill="#6B7280">Only leads who replied</text><line x1="854" y1="327" x2="876" y2="327" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/></svg>