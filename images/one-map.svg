<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 470" width="1260" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="1260" height="470" fill="#fff"/><text x="40" y="44" font-size="22" fill="#1F2937" font-weight="700" text-anchor="start">How the systems fit together</text><text x="40" y="68" font-size="14" fill="#6B7280" font-weight="400" text-anchor="start">Fibery is the source of truth. Each system was built with Claude Code.</text><rect x="40" y="110" width="300" height="120" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><text x="58" y="140" font-size="16" font-weight="700" fill="#1F2937">Outbound engine</text><text x="58" y="166" font-size="13" fill="#6B7280">Signals, qualification, contacts,</text><text x="58" y="185" font-size="13" fill="#6B7280">copy, and Apollo sequencing</text><rect x="460" y="96" width="340" height="148" rx="10" fill="#E4F3F0" stroke="#0F766E" stroke-width="1.5"/><text x="478" y="126" font-size="16" font-weight="700" fill="#1F2937">Fibery</text><text x="478" y="152" font-size="13" fill="#6B7280">Source of truth and tracker.</text><text x="478" y="171" font-size="13" fill="#6B7280">Pipeline, CRM, deals, reporting.</text><text x="478" y="190" font-size="13" fill="#6B7280">Positive replies promoted to CRM</text><rect x="920" y="110" width="300" height="120" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><text x="938" y="140" font-size="16" font-weight="700" fill="#1F2937">Reporting</text><text x="938" y="166" font-size="13" fill="#6B7280">1 real-time dashboard.</text><text x="938" y="185" font-size="13" fill="#6B7280">Weekly Slack pipeline and</text><text x="938" y="204" font-size="13" fill="#6B7280">coaching report</text><rect x="460" y="300" width="340" height="120" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5"/><text x="478" y="330" font-size="16" font-weight="700" fill="#1F2937">Call intelligence</text><text x="478" y="356" font-size="13" fill="#6B7280">Sybill to Zapier to Fibery.</text><text x="478" y="375" font-size="13" fill="#6B7280">Follow-up tasks from each call</text><line x1="344" y1="170" x2="456" y2="170" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><line x1="804" y1="170" x2="916" y2="170" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><line x1="630" y1="296" x2="630" y2="248" stroke="#6B7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="40" y="300" width="300" height="120" rx="10" fill="#F4F5F7" stroke="#D5D9E0" stroke-width="1.5" stroke-dasharray="6 5"/><text x="58" y="330" font-size="16" font-weight="700" fill="#1F2937">Listings platform</text><text x="58" y="356" font-size="13" fill="#6B7280">Supabase, Next.js, Mapbox.</text><text x="58" y="375" font-size="13" fill="#6B7280">Off-market listings parsed</text><text x="58" y="394" font-size="13" fill="#6B7280">into one searchable database</text><text x="40" y="448" font-size="12" fill="#6B7280" font-weight="400" text-anchor="start">Dashed box: a separate system.</text></svg>